name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build site (strict — fails if the GitHub API is unreachable)
        run: npx astro build
        env:
          STRICT_RELEASES: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the generated site
        run: node scripts/verify-site.mjs _site

      - name: Run tests
        run: npm test

      - name: Upload Pages artifact (the exact tested build)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  brew:
    name: Homebrew validation
    runs-on: macos-latest
    steps:
      - name: Checkout into a tap path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: homebrew-den

      # verify-checksums.mjs runs on Node (builtins + src/lib/catalog.mjs only,
      # so no npm ci is needed) — pin the runtime instead of trusting the image.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Link the repo as a Homebrew tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/mrdemonwolf/homebrew-den"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE/homebrew-den" "$TAP_DIR"

      - name: brew style (formulae + casks only)
        run: |
          shopt -s nullglob
          brew style homebrew-den/Formula/*.rb homebrew-den/Casks/*.rb

      - name: brew readall
        run: brew readall mrdemonwolf/den

      # brew audit/livecheck call the GitHub API directly. Unauthenticated they
      # share a 60 req/hr per-IP limit with every other job on the runner, so the
      # job failed intermittently ("API rate limit exceeded") regardless of the
      # formula/cask contents. Scoped to these two steps only — brew install and
      # brew test run formula-controlled code and must not see the token.
      - name: brew audit (strict, online)
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in homebrew-den/Formula/*.rb; do
            brew audit --strict --online --formula "mrdemonwolf/den/$(basename "${f%.rb}")"
          done
          for c in homebrew-den/Casks/*.rb; do
            brew audit --strict --online --cask "mrdemonwolf/den/$(basename "${c%.rb}")"
          done

      - name: Verify release artifact checksums
        run: node homebrew-den/scripts/verify-checksums.mjs

      - name: brew livecheck (informational)
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: brew livecheck --tap mrdemonwolf/den

      - name: Install smoke test (formula, informational)
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in homebrew-den/Formula/*.rb; do
            name="mrdemonwolf/den/$(basename "${f%.rb}")"
            brew install --formula "$name"
            brew test "$name" || true
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, brew]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy the artifact that passed CI
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
